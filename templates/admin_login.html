<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-950 flex items-center justify-center">

    <div class="w-full max-w-md px-6">

        <div class="bg-slate-900 border border-slate-800
                    rounded-2xl p-8 shadow-2xl">

            <div class="mb-8">

                <div class="text-cyan-400 text-sm font-semibold
                            uppercase tracking-widest mb-3">
                    AI News Portal
                </div>

                <h1 class="text-3xl font-bold text-white">
                    Admin Dashboard
                </h1>

                <p class="text-slate-400 mt-2">
                    Private analytics access
                </p>

            </div>

            {% if error %}

            <div class="mb-5 rounded-lg bg-red-500/10
                        border border-red-500/20
                        text-red-300 px-4 py-3">
                {{ error }}
            </div>

            {% endif %}

            <form method="POST">

                <label class="block text-sm text-slate-300 mb-2">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    required
                    autocomplete="username"
                    class="w-full mb-5 px-4 py-3
                           rounded-lg bg-slate-800
                           border border-slate-700
                           text-white outline-none
                           focus:border-cyan-400"
                >

                <label class="block text-sm text-slate-300 mb-2">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    required
                    autocomplete="current-password"
                    class="w-full mb-6 px-4 py-3
                           rounded-lg bg-slate-800
                           border border-slate-700
                           text-white outline-none
                           focus:border-cyan-400"
                >

                <button
                    type="submit"
                    class="w-full rounded-lg
                           bg-cyan-400
                           hover:bg-cyan-300
                           text-slate-950
                           font-bold py-3 transition">
                    Sign in
                </button>

            </form>

        </div>

    </div>

</body>
</html>
